name: Generate profile cards

on:
  schedule:
    - cron: "0 18 * * *" # 每天 UTC 18:00 = UTC+8 次日 02:00
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Both artifacts must land in the same dist/ and ship in one push:
      # the deploy step replaces the output branch wholesale, so pushing
      # them separately would delete whichever went first.
      #
      # Streak runs first on purpose. snk is a docker action that creates
      # dist/ as root, and the runner user cannot write into it afterwards.
      - name: Generate streak cards
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: dist
        run: python3 scripts/generate_streak.py

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Writes to a fixed profile-3d-contrib/ directory, so collect the two
      # variants we actually reference into dist/ afterwards.
      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect 3D calendar into dist
        run: |
          cp profile-3d-contrib/profile-night-view.svg dist/contrib-3d-dark.svg
          cp profile-3d-contrib/profile-green-animate.svg dist/contrib-3d.svg

      # Upstream prints a UTC-truncated total and star/fork counters that
      # have no setting to disable. Rewrite both so the figure matches the
      # streak card above it.
      - name: Correct counts on the 3D calendar
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/patch_3d.py dist/contrib-3d-dark.svg dist/contrib-3d.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
